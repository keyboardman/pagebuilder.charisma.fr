# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    storage.fonts.path: '%kernel.project_dir%/var/storage/fonts'
    app.builder_form.honeypot_field: '_builder_form_hp'
    app.builder_form.rate_limit.max_attempts: 25
    app.builder_form.rate_limit.window_seconds: 3600
    app.builder_form.mail_from: 'noreply@localhost'
    app.builder_form.generic_error_message: 'Impossible d’envoyer le message pour le moment. Réessayez plus tard.'

services:
    font_storage.adapter:
        class: League\Flysystem\Local\LocalFilesystemAdapter
        arguments:
            $location: '%storage.fonts.path%'

    font_storage.filesystem:
        class: League\Flysystem\Filesystem
        arguments:
            $adapter: '@font_storage.adapter'

    League\Flysystem\FilesystemOperator:
        alias: font_storage.filesystem

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    App\:
        resource: '../src/'

    # Surcharges : arguments non autowirés (doivent être après App\ pour remplacer)
    App\Service\FontStorage:
        arguments:
            $filesystem: '@font_storage.filesystem'

    App\Service\ThemeCssGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Controller\ThemeAssetController:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Controller\MediaAssetController:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\EventListener\DisableProfilerOnMediaUploadListener:
        arguments:
            $profiler: '@?profiler'

    App\PageBuilder\ApiCard\ApiCardRegistry:
        arguments:
            $cards: !tagged_iterator app.builder_api_card

    # StubApiCard : pas de tag pour ne pas l’afficher dans le builder (conservé pour tests)
    # App\PageBuilder\ApiCard\StubApiCard:
    #     tags: [app.builder_api_card]

    App\PageBuilder\ApiCard\FlashnewsApiCard:
        tags: [app.builder_api_card]

    App\PageBuilder\ApiCard\FlashnewsThemeApiList:
        tags: [app.builder_api_card]

    App\PageBuilder\ApiCard\CharismaArticleAuteurApiCard:
        tags: [app.builder_api_card]

    App\PageBuilder\ApiCard\CharismaVideosApiCard:
        tags: [app.builder_api_card]

    App\PageBuilder\ApiCard\CharismaTemoignageApiCard:
        tags: [app.builder_api_card]

    App\PageBuilder\ApiCard\CharismaEvenementApiCard:
        tags: [app.builder_api_card]

    App\PageBuilder\ApiCard\CharismaEvenementHomeApiCard:
        tags: [app.builder_api_card]

    App\PageBuilder\ApiCard\CharismaEvenementRetrospectiveApiCard:
        tags: [app.builder_api_card]

    App\PageBuilder\ApiCard\CharismaArticleEnactionHomeApiList:
        tags: [app.builder_api_card]

    App\PageBuilder\ApiCard\CharismaArticleExpressionHomeApiList:
        tags: [app.builder_api_card]

    App\PageBuilder\ApiCard\StubNavListApiCard:
        tags: [app.builder_api_card]

when@test:
    parameters:
        app.builder_form.rate_limit.max_attempts: 2


